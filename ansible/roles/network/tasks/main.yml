---
- name: Prefer IPv4 over IPv6
  ansible.builtin.lineinfile:
    path: /etc/gai.conf
    regexp: '^#?precedence ::ffff:0:0/96'
    line: 'precedence ::ffff:0:0/96  100'
    state: present
    backup: true

- name: Create systemd-resolved configuration directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure systemd-resolved for Docker DNS host
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/pi5-lab.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Resolve]
      DNS=1.1.1.1 9.9.9.9
      DNSStubListener=no
  notify: Restart systemd-resolved

- name: Point resolv.conf to systemd-resolved upstream file
  ansible.builtin.file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
