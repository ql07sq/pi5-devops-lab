---
- name: Provision Raspberry Pi
  hosts: pi
  become: true

  tasks:
    - name: Show operating system
      ansible.builtin.debug:
        msg: "Provisioning {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Ensure Docker keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
