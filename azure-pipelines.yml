trigger:
- main

pool:
  name: Default
  demands:
  - Agent.Name -equals PI5-LAB

steps:
- checkout: self

- bash: |
    set -e

    if ! command -v ansible-playbook >/dev/null 2>&1; then
      echo "Ansible ontbreekt, installeren..."
      sudo apt-get update
      sudo apt-get install -y ansible
    fi

    ansible --version
  displayName: 'Controleer Ansible'

- bash: |
    set -e

    cd ansible

    ansible-playbook \
      -i inventory.ini \
      provision.yml
  displayName: 'Provision Raspberry Pi'